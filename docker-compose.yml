version: '3.8'

services:
  web:
    build: .
    container_name: universal-ai-platform
    ports:
      - "5000:5000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FLASK_ENV=production
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/core/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
